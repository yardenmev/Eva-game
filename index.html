<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המשחקים של אווה - אלף בית</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        h1 {
            color: #ff4757;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #5352ed;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .main-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
        }

        .menu-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 4px solid #ff6b81;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            background: #fff2f4;
        }

        .menu-card .icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .menu-card h3 {
            color: #2f3542;
            font-size: 1.4rem;
            margin: 0;
        }

        .game-container {
            display: none;
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
        }

        .back-btn:hover {
            background: #ff6b81;
        }

        /* Explorer Game Styles */
        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .letter-btn {
            background: #70a1ff;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 2rem;
            font-weight: bold;
            height: 70px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(112, 161, 255, 0.4);
            transition: transform 0.1s, background 0.2s;
        }

        .letter-btn:active {
            transform: scale(0.95);
            background: #1e90ff;
        }

        .display-box {
            background: #f1f2f6;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px dashed #70a1ff;
        }

        .display-box .big-letter {
            font-size: 3.5rem;
            color: #2f3542;
            font-weight: bold;
        }

        .display-box .example-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .display-box .emoji {
            font-size: 3rem;
        }

        .display-box .word {
            font-size: 1.8rem;
            color: #ff4757;
            font-weight: bold;
        }

        /* What Starts With Game Styles */
        .quiz-emoji {
            font-size: 6rem;
            margin: 20px 0;
            animation: bounce 1.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 20px auto;
        }

        .option-btn {
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 3rem;
            font-weight: bold;
            height: 100px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(46, 213, 115, 0.4);
            transition: transform 0.1s;
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        /* Memory Game Styles */
        .memory-controls {
            margin-bottom: 15px;
        }

        .memory-controls button {
            background: #ffa502;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 0 5px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        .memory-card {
            background: #70a1ff;
            color: transparent;
            border-radius: 12px;
            font-size: 2.2rem;
            font-weight: bold;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }

        .memory-card.flipped {
            background: white;
            color: #2f3542;
            border: 3px solid #70a1ff;
            transform: rotateY(180deg);
        }

        .message-area {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 40px;
            color: #ff4757;
        }
    </style>
</head>
<body>

    <h1>🌟 המשחקים של אווה 🌟</h1>
    <div class="subtitle">בואי נלמד אותיות באהבה ובכיף!</div>

    <!-- תפריט ראשי -->
    <div id="mainMenu" class="main-menu">
        <div class="menu-card" onclick="openGame('explorer')">
            <div class="icon">🔍</div>
            <h3>חוקר האותיות</h3>
        </div>
        <div class="menu-card" onclick="openGame('quiz')">
            <div class="icon">🍎</div>
            <h3>מה מתחיל ב...?</h3>
        </div>
        <div class="menu-card" onclick="openGame('memory')">
            <div class="icon">🧠</div>
            <h3>משחק הזיכרון</h3>
        </div>
    </div>

    <!-- משחק 1: חוקר האותיות -->
    <div id="gameExplorer" class="game-container">
        <button class="back-btn" onclick="closeGames()">🏠 תפריט</button>
        <h2>🔍 חוקר האותיות</h2>
        <div class="display-box" id="explorerDisplay">
            <div class="big-letter">לחצי על אות!</div>
        </div>
        <div class="alphabet-grid" id="explorerGrid"></div>
    </div>

    <!-- משחק 2: מה מתחיל ב...? -->
    <div id="gameQuiz" class="game-container">
        <button class="back-btn" onclick="closeGames()">🏠 תפריט</button>
        <h2>🍎 מה מתחיל ב...?</h2>
        <div id="quizContent">
            <div class="quiz-emoji" id="quizEmoji">🍎</div>
            <button onclick="playCurrentQuizWord()" style="background:#ff4757; color:white; border:none; padding:10px 20px; font-size:1.2rem; border-radius:30px; cursor:pointer; margin-bottom:15px;">🔊 שמעי את המילה</button>
            <div class="options-grid" id="quizOptions"></div>
        </div>
        <div class="message-area" id="quizMessage"></div>
    </div>

    <!-- משחק 3: משחק הזיכרון -->
    <div id="gameMemory" class="game-container">
        <button class="back-btn" onclick="closeGames()">🏠 תפריט</button>
        <h2>🧠 משחק הזיכרון</h2>
        <div class="memory-controls">
            <span>בחר רמת קושי: </span>
            <button onclick="startMemoryGame(3)">קל (3 זוגות)</button>
            <button onclick="startMemoryGame(4)">בינוני (4 זוגות)</button>
            <button onclick="startMemoryGame(6)">אתגר (6 זוגות)</button>
        </div>
        <div class="memory-grid" id="memoryGrid"></div>
        <div class="message-area" id="memoryMessage"></div>
    </div>

    <script>
        const alphabetData = [
            { letter: 'א', name: 'אָלֶף', exampleWord: 'אַרְיֵה', exampleEmoji: '🦁' },
            { letter: 'ב', name: 'בֵּת', exampleWord: 'בָּנָנָה', exampleEmoji: '🍌' },
            { letter: 'ג', name: 'גִּימֶל', exampleWord: 'גָּמָל', exampleEmoji: '🐪' },
            { letter: 'ד', name: 'דָּלֶת', exampleWord: 'דּוּבִי', exampleEmoji: '🧸' },
            { letter: 'ה', name: 'הֵא', exampleWord: 'הַר', exampleEmoji: '⛰️' },
            { letter: 'ו', name: 'וָאו', exampleWord: 'וָרֶד', exampleEmoji: '🌹' },
            { letter: 'ז', name: 'זַיִן', exampleWord: 'זֶבְּרָה', exampleEmoji: '🦓' },
            { letter: 'ח', name: 'חֵת', exampleWord: 'חָצִיל', exampleEmoji: '🍆' },
            { letter: 'ט', name: 'טֵת', exampleWord: 'טַפָּח', exampleEmoji: '🧸' },
            { letter: 'י', name: 'יוּד', exampleWord: 'יַלְדָּה', exampleEmoji: '👧' },
            { letter: 'כ', name: 'כָּף', exampleWord: 'כַּדּוּר', exampleEmoji: '⚽' },
            { letter: 'ל', name: 'לָמֶד', exampleWord: 'לִימוֹן', exampleEmoji: '🍋' },
            { letter: 'מ', name: 'מֵם', exampleWord: 'מְכוֹנִית', exampleEmoji: '🚗' },
            { letter: 'נ', name: 'נוּן', exampleWord: 'נָמֵר', exampleEmoji: '🐅' },
            { letter: 'ס', name: 'סָמֶך', exampleWord: 'סוּס', exampleEmoji: '🐎' },
            { letter: 'ע', name: 'עַיִן', exampleWord: 'עַגְבָנִיָּה', exampleEmoji: '🍅' },
            { letter: 'פ', name: 'פֵּא', exampleWord: 'פִּיל', exampleEmoji: '🐘' },
            { letter: 'צ', name: 'צָדִי', exampleWord: 'צִפּוֹר', exampleEmoji: '🐦' },
            { letter: 'ק', name: 'קוֹף', exampleWord: 'קוּף', exampleEmoji: '🐒' },
            { letter: 'ר', name: 'רֵישׁ', exampleWord: 'רֹאשׁ', exampleEmoji: '👑' },
            { letter: 'ש', name: 'שִׁיִן', exampleWord: 'שֶׁמֶשׁ', exampleEmoji: '☀️' },
            { letter: 'ת', name: 'תָּו', exampleWord: 'תַּפּוּחַ', exampleEmoji: '🍎' }
        ];

        // מנגנון הקראה פנימי מובטח
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'he-IL';
                utterance.rate = 0.9;
                
                let voices = window.speechSynthesis.getVoices();
                let heVoice = voices.find(v => v.lang.includes('he') || v.lang.includes('iw'));
                if (heVoice) {
                    utterance.voice = heVoice;
                }
                
                window.speechSynthesis.speak(utterance);
            }
        }

        function playSoundTone(freq, type = 'sine', duration = 0.15) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playSuccessSound() {
            playSoundTone(523.25, 'sine', 0.1);
            setTimeout(() => playSoundTone(659.25, 'sine', 0.1), 100);
            setTimeout(() => playSoundTone(783.99, 'sine', 0.2), 200);
        }

        function openGame(gameName) {
            document.getElementById('mainMenu').style.display = 'none';
            document.querySelectorAll('.game-container').forEach(el => el.style.display = 'none');
            
            if (gameName === 'explorer') {
                document.getElementById('gameExplorer').style.display = 'block';
                initExplorer();
            } else if (gameName === 'quiz') {
                document.getElementById('gameQuiz').style.display = 'block';
                nextQuizQuestion();
            } else if (gameName === 'memory') {
                document.getElementById('gameMemory').style.display = 'block';
                startMemoryGame(3);
            }
        }

        function closeGames() {
            document.querySelectorAll('.game-container').forEach(el => el.style.display = 'none');
            document.getElementById('mainMenu').style.display = 'grid';
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        // --- חוקר האותיות ---
        function initExplorer() {
            const grid = document.getElementById('explorerGrid');
            if (grid.children.length > 0) return; // טען פעם אחת בלבד
            
            alphabetData.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.innerText = item.letter;
                btn.onclick = () => {
                    playSoundTone(440);
                    document.getElementById('explorerDisplay').innerHTML = `
                        <div class="big-letter">${item.letter} - ${item.name}</div>
                        <div class="example-container">
                            <span class="emoji">${item.exampleEmoji}</span>
                            <span class="word">${item.exampleWord}</span>
                        </div>
                    `;
                    speak(`${item.name}, ${item.exampleWord}`);
                };
                grid.appendChild(btn);
            });
        }

        // --- מה מתחיל ב...? ---
        let currentQuizItem = null;

        function nextQuizQuestion() {
            document.getElementById('quizMessage').innerText = '';
            const randomIndex = Math.floor(Math.random() * alphabetData.length);
            currentQuizItem = alphabetData[randomIndex];
            
            document.getElementById('quizEmoji').innerText = currentQuizItem.exampleEmoji;
            
            // בחירת 3 מסיחים שונים
            let options = [currentQuizItem];
            while (options.length < 4) {
                let randomOpt = alphabetData[Math.floor(Math.random() * alphabetData.length)];
                if (!options.some(o => o.letter === randomOpt.letter)) {
                    options.push(randomOpt);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const optionsGrid = document.getElementById('quizOptions');
            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.letter;
                btn.onclick = () => checkQuizAnswer(opt.letter);
                optionsGrid.appendChild(btn);
            });

            speak(currentQuizItem.exampleWord);
        }

        function playCurrentQuizWord() {
            if (currentQuizItem) {
                speak(currentQuizItem.exampleWord);
            }
        }

        function checkQuizAnswer(selectedLetter) {
            if (selectedLetter === currentQuizItem.letter) {
                playSuccessSound();
                document.getElementById('quizMessage').innerText = 'כל הכבוד! אלופה!';
                speak('כל הכבוד אלופה');
                setTimeout(nextQuizQuestion, 1800);
            } else {
                playSoundTone(220, 'sawtooth', 0.2);
                document.getElementById('quizMessage').innerText = 'נסי שוב מתוקה!';
                speak('נסי שוב');
            }
        }

        // --- משחק הזיכרון ---
        let flippedCards = [];
        let matchedPairs = 0;
        let isLocked = false;

        function startMemoryGame(pairsCount) {
            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';
            document.getElementById('memoryMessage').innerText = '';
            flippedCards = [];
            matchedPairs = 0;
            isLocked = false;

            // בחר זוגות באקראי
            let selected = [...alphabetData].sort(() => Math.random() - 0.5).slice(0, pairsCount);
            let cardValues = [];
            selected.forEach(item => {
                cardValues.push({ letter: item.letter, name: item.name });
                cardValues.push({ letter: item.letter, name: item.name });
            });
            cardValues.sort(() => Math.random() - 0.5);

            grid.style.gridTemplateColumns = pairsCount === 6 ? 'repeat(4, 1fr)' : 'repeat(3, 1fr)';

            cardValues.forEach(val => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.letter = val.letter;
                card.dataset.name = val.name;
                card.innerText = '?';
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playSoundTone(600);
            card.classList.add('flipped');
            card.innerText = card.dataset.letter;
            speak(card.dataset.name);

            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            isLocked = true;
            const [card1, card2] = flippedCards;

            if (card1.dataset.letter === card2.dataset.letter) {
                playSuccessSound();
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                flippedCards = [];
                isLocked = false;

                const totalPairs = document.querySelectorAll('.memory-card').length / 2;
                if (matchedPairs === totalPairs) {
                    document.getElementById('memoryMessage').innerText = 'כל הכבוד! סיימת את המשחק!';
                    speak('כל הכבוד אלופה סיימת את המשחק');
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card1.innerText = '?';
                    card2.classList.remove('flipped');
                    card2.innerText = '?';
                    flippedCards = [];
                    isLocked = false;
                }, 1000);
            }
        }
    </script>
</body>
</html>
